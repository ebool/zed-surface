name = "Surface"
grammar = "surface"
path_suffixes = ["sface"]
tab_size = 2
hard_tabs = false
autoclose_before = ">})%"
word_characters = ["@", "!", "?"]
brackets = [
  { start = "{", end = "}", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
